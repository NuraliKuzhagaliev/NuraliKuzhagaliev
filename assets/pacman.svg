  <pattern id="grid" x="82" y="115" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="14" height="14" rx="3" fill="#1c2a3d"/></pattern>
  <clipPath id="frame"><rect width="1100" height="300" rx="22"/></clipPath>
</defs>
