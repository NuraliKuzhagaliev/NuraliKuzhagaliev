<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Nurali arcade: autoplay Pac-Man</title>
<desc id="desc">A decorative Pac-Man automatically navigates a grid, eats thirteen scattered glowing pellets, then repeats.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#0b1223"/></linearGradient>
