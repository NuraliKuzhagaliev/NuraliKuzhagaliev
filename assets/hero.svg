<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Nurali Kuzhagaliev — signal to action</title>
  <desc id="desc">An animated signal moves through configuration checks and a voice workflow.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101a32"/>
      <stop offset="1" stop-color="#0b1223"/>
    </linearGradient>
    <linearGradient id="line">
      <stop stop-color="#4be0c7"/>
      <stop offset=".55" stop-color="#7baaff"/>
      <stop offset="1" stop-color="#d8a9ff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".075"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1090" cy="40" r="220" fill="#638aff" opacity=".045"/>
    <circle cx="70" cy="390" r="210" fill="#48dbc3" opacity=".045"/>

    <text x="56" y="56" fill="#67e4cf" font-family="monospace" font-size="14" letter-spacing="3">NURALI / BUILD LOG 001</text>
    <text x="56" y="117" fill="#f5f8ff" font-family="Arial, sans-serif" font-size="46" font-weight="700">From signal to action.</text>
    <text x="57" y="153" fill="#aabbd5" font-family="Arial, sans-serif" font-size="19">Thoughtful interfaces. Clear checks. Real workflows.</text>

    <path d="M190 365H1012" stroke="#37506a" stroke-width="3" stroke-dasharray="5 9"/>
    <path d="M190 365H1012" stroke="url(#line)" stroke-width="3" stroke-dasharray="100 850" opacity=".8">
      <animate attributeName="stroke-dashoffset" values="950;0" dur="7s" repeatCount="indefinite"/>
    </path>

    <g font-family="Arial, sans-serif">
      <rect x="56" y="205" width="276" height="142" rx="16" fill="#15243b" stroke="#37646c"/>
      <text x="77" y="238" fill="#64e3cd" font-size="13" font-weight="700" letter-spacing="2">01 / OBSERVE</text>
      <text x="77" y="269" fill="#f5f8ff" font-size="23" font-weight="700">A signal appears</text>
      <text x="77" y="313" fill="#aabbd5" font-size="16">source · contract · context</text>

      <rect x="462" y="205" width="276" height="142" rx="16" fill="#15243b" stroke="#4a6190"/>
      <text x="483" y="238" fill="#8bb3ff" font-size="13" font-weight="700" letter-spacing="2">02 / VERIFY</text>
      <text x="483" y="269" fill="#f5f8ff" font-size="23" font-weight="700">DriftLens</text>
      <text x="483" y="313" fill="#aabbd5" font-size="16">scan · explain · gate</text>

      <rect x="868" y="205" width="276" height="142" rx="16" fill="#15243b" stroke="#80649a"/>
      <text x="889" y="238" fill="#d9aeff" font-size="13" font-weight="700" letter-spacing="2">03 / ASSIST</text>
      <text x="889" y="269" fill="#f5f8ff" font-size="23" font-weight="700">SlotPilot</text>
      <text x="889" y="313" fill="#aabbd5" font-size="16">listen · propose · confirm</text>
    </g>

    <circle cx="190" cy="365" r="8" fill="#65e5cd"/>
    <circle cx="600" cy="365" r="8" fill="#91b5ff"/>
    <circle cx="1012" cy="365" r="8" fill="#dbadff"/>
    <circle cx="190" cy="365" r="8" fill="none" stroke="#65e5cd" stroke-width="2">
      <animate attributeName="r" values="8;20;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0;.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="365" r="8" fill="none" stroke="#91b5ff" stroke-width="2">
      <animate attributeName="r" values="8;20;8" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0;.8" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1012" cy="365" r="8" fill="none" stroke="#dbadff" stroke-width="2">
      <animate attributeName="r" values="8;20;8" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0;.8" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="389" fill="#8498b8" font-family="monospace" font-size="13">BUILD  /  TEST  /  LEARN  /  REPEAT</text>
    <text x="1144" y="389" text-anchor="end" fill="#8498b8" font-family="monospace" font-size="13">ASTANA · KZ</text>
  </g>
</svg>
