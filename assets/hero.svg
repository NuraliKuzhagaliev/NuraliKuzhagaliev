<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nurali Kuzhagaliev — Web, AI and security</title>
  <desc id="desc">A dark portfolio banner with a cyan accent, Nurali's name and a terminal-style build, test, learn motif.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1420"/><stop offset="1" stop-color="#111f30"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#62e6cb"/><stop offset=".6" stop-color="#81b7ff"/><stop offset="1" stop-color="#b5a1ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#799aba" stroke-opacity=".07"/></pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1120" cy="340" r="240" fill="#62e6cb" opacity=".035"/>
    <rect width="1200" height="4" fill="url(#edge)"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="48" y="48" font-family="monospace" font-size="12" letter-spacing="3" fill="#62e6cb">N / K — PROJECT NOTEBOOK</text>
      <text x="48" y="125" font-size="62" font-weight="700" letter-spacing="-2" fill="#f4f7fc">Nurali Kuzhagaliev</text>
      <text x="51" y="170" font-size="23" fill="#bac9de">I build tools that turn complexity into clear next steps.</text>
      <text x="51" y="208" font-size="16" fill="#849ab8">IT student · Astana, Kazakhstan · Learning through building</text>
      <g font-family="monospace" font-size="13" fill="#dce6f4">
        <rect x="48" y="250" width="140" height="34" rx="17" fill="#172c36" stroke="#315653"/>
        <text x="118" y="272" text-anchor="middle">WEB APPS</text>
        <rect x="200" y="250" width="174" height="34" rx="17" fill="#172637" stroke="#304863"/>
        <text x="287" y="272" text-anchor="middle">AI INTERFACES</text>
        <rect x="386" y="250" width="164" height="34" rx="17" fill="#242739" stroke="#49405e"/>
        <text x="468" y="272" text-anchor="middle">CYBERSECURITY</text>
      </g>
    </g>
    <g transform="translate(823 75)">
      <rect width="329" height="220" rx="14" fill="#0a1420" stroke="#2b3d53"/>
      <path d="M0 42H329" stroke="#2b3d53"/>
      <circle cx="20" cy="21" r="4" fill="#ff8585"/><circle cx="35" cy="21" r="4" fill="#e8c875"/><circle cx="50" cy="21" r="4" fill="#62e6cb"/>
      <text x="309" y="26" text-anchor="end" fill="#7891ae" font-size="11" font-family="monospace">~/workspace</text>
      <g font-family="monospace" font-size="16">
        <text x="24" y="80" fill="#849ab8">$ <tspan fill="#dce6f4">build --with-purpose</tspan></text>
        <text x="24" y="115" fill="#62e6cb">→ <tspan fill="#aebed2">make it useful</tspan></text>
        <text x="24" y="145" fill="#81b7ff">→ <tspan fill="#aebed2">test the assumptions</tspan></text>
        <text x="24" y="175" fill="#b5a1ff">→ <tspan fill="#aebed2">learn &amp; iterate</tspan></text>
        <rect x="24" y="194" width="9" height="3" rx="1" fill="#62e6cb">
          <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <path d="M48 314H1152" stroke="#2b3d53"/>
    <text x="48" y="340" fill="#7891ae" font-family="monospace" font-size="11" letter-spacing="2">BUILD / VERIFY / IMPROVE</text>
    <text x="1152" y="340" text-anchor="end" fill="#7891ae" font-family="monospace" font-size="11" letter-spacing="2">SMALL DETAILS. WORKING SOFTWARE.</text>
  </g>
</svg>
